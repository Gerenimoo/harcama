<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bugün Ne Kadar</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bugün">
<meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f6f7f5;
    --surface: #ffffff;
    --text: #151816;
    --muted: #5f6762;
    --accent: #3d4340;
    --accent-text: #ffffff;
    --ok: #1f8a5b;
    --danger: #c0392b;
    --warn: #b7791f;
    --key: #e8ebe8;
    --key-active: #d3d8d4;
    --track: #e1e5e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111412;
      --surface: #1b1f1c;
      --text: #f1f3f1;
      --muted: #9aa39d;
      --accent: #c8cec9;
      --accent-text: #141816;
      --ok: #2fae76;
      --danger: #ff6b5b;
      --warn: #f2c14e;
      --key: #252a26;
      --key-active: #343a35;
      --track: #2a302b;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
  }
  .app {
    height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 10px);
  }
  .top { display: flex; align-items: center; min-height: 44px; gap: 4px; }
  .top .title { flex: 1; font-size: 15px; color: var(--muted); }
  .pill { border: 0; background: var(--key); color: var(--text); border-radius: 18px; font-size: 15px; font-weight: 600; padding: 8px 14px; }
  .icon-btn { border: 0; background: transparent; color: var(--muted); font-size: 26px; width: 44px; height: 44px; border-radius: 22px; }

  .hero { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .label { font-size: 17px; color: var(--muted); }
  .big {
    font-size: clamp(56px, 20vw, 100px); font-weight: 800; line-height: 1.05; letter-spacing: -2px;
    font-variant-numeric: tabular-nums; margin: 2px 0 10px; white-space: nowrap;
  }
  .big small { font-size: .5em; font-weight: 700; margin-left: 4px; }
  /* Büyük rakam bugünü gösterir: yeşil payın içinde, kırmızı bugünkü pay aşıldı */
  .big { color: var(--ok); transition: color .3s; }
  .big.neg { color: var(--danger); }
  .bar { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; margin: 4px 0; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 5px; transition: width .3s; }
  .bar.warn i { background: var(--warn); }
  .bar.bad i { background: var(--danger); }
  .barlbl { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .alert { font-size: 15px; font-weight: 700; margin-top: 4px; }
  .alert.warn { color: var(--warn); }
  .alert.bad { color: var(--danger); }
  .alert.info { color: var(--muted); font-weight: 500; }
  .line { font-size: 16px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .line b { color: var(--text); white-space: nowrap; }

  .entry {
    background: var(--surface); border-radius: 14px; font-size: 36px; font-weight: 700; text-align: right;
    padding: 6px 16px; min-height: 58px; margin: 10px 0 8px; font-variant-numeric: tabular-nums;
  }
  .entry.empty { color: var(--muted); font-weight: 500; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pad button {
    border: 0; background: var(--key); color: var(--text); font-size: 28px; font-weight: 600;
    height: clamp(44px, 6.8vh, 60px); border-radius: 12px;
  }
  .pad button:active { background: var(--key-active); }
  .cats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .cats button {
    grid-column: span 2; border: 0; background: var(--accent); color: var(--accent-text);
    font-size: 18px; font-weight: 800; height: clamp(46px, 7vh, 62px); border-radius: 14px;
  }
  .cats button:nth-child(n+4) { grid-column: span 3; }
  .cats.off button { opacity: .35; }
  .sign { text-align: center; font-size: 22px; opacity: .75; margin-top: 6px; font-family: "Savoye LET", "Snell Roundhand", cursive; }

  /* Pencereler: geçmiş, düzeltme, ayarlar */
  .sheet {
    position: fixed; inset: 0; background: var(--bg); color: var(--text); display: none; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
    overflow-y: auto; -webkit-user-select: text; user-select: text; z-index: 5;
  }
  .sheet.open { display: flex; }
  .sheet-inner { max-width: 480px; width: 100%; margin: 0 auto; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet h2 { font-size: 28px; margin: 8px 0; }
  .sheet .intro { font-size: 16px; color: var(--muted); margin: 0 0 18px; }
  .sheet h3 { font-size: 18px; margin: 20px 0 10px; }
  .field { margin-bottom: 20px; }
  .field > label { display: block; font-size: 17px; color: var(--muted); margin-bottom: 8px; }
  .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .err { color: var(--danger); font-size: 16px; min-height: 22px; margin-bottom: 8px; }
  input.f {
    width: 100%; font-size: 24px; padding: 12px 16px; border-radius: 14px;
    border: 2px solid var(--key); background: var(--surface); color: var(--text);
  }
  input.f:focus { outline: none; border-color: var(--accent); }
  .btn { width: 100%; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-text); font-size: 20px; font-weight: 800; height: 58px; margin-top: 10px; }
  .btn.sec { background: var(--key); color: var(--text); font-weight: 600; }
  .btn.link { background: transparent; color: var(--danger); font-weight: 600; }
  .reset-link { border: 0; background: transparent; color: var(--danger); font-size: 14px; text-decoration: underline; padding: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 2px solid var(--key); background: var(--surface); color: var(--text); border-radius: 20px; padding: 8px 14px; font-size: 16px; }
  .chips button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .card { background: var(--surface); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .card h4 { margin: 0 0 6px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 17px; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .res { font-weight: 700; margin-top: 6px; }
  .good { color: var(--ok); }
  .badc { color: var(--danger); }
  .item {
    display: flex; align-items: center; gap: 10px; width: 100%; border: 0; text-align: left; color: var(--text);
    background: var(--surface); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; font-size: 16px;
  }
  .item .meta { flex: 1; min-width: 0; }
  .item .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--muted); font-size: 15px; text-align: center; padding: 12px 0; }
  .cats-box { margin-top: 8px; border-top: 1px solid var(--track); padding-top: 8px; }
  .catrow { display: grid; grid-template-columns: 64px 1fr 124px; align-items: center; gap: 10px; font-size: 15px; padding: 3px 0; }
  .catrow .bar { margin: 0; height: 8px; }
  .catrow span:last-child { font-variant-numeric: tabular-nums; text-align: right; min-width: 72px; }

  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 22px; font-size: 16px;
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { border: 0; background: var(--bg); color: var(--text); border-radius: 16px; font-size: 14px; font-weight: 700; padding: 6px 12px; }

  @media (max-height: 700px) {
    .big { font-size: clamp(48px, 16vw, 76px); margin: 0 0 6px; }
    .label { font-size: 15px; }
    .line, .barlbl, .alert { font-size: 14px; }
    .entry { font-size: 30px; min-height: 48px; padding: 4px 14px; margin: 8px 0 6px; }
    .pad { gap: 5px; }
    .pad button { font-size: 26px; }
    .cats { gap: 5px; margin-top: 6px; }
    .cats button { font-size: 17px; }
    .sign { font-size: 19px; margin-top: 3px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title" id="periodTitle"></span>
    <button class="pill" id="openHistory">Geçmiş</button>
    <button class="icon-btn" id="openSettings" aria-label="Ayarlar">⚙︎</button>
  </div>
  <div class="hero">
    <div class="label" id="label">Bugün harcayabileceğin</div>
    <div class="big" id="big">–</div>
    <div class="bar" id="bar"><i></i></div>
    <div class="barlbl"><span id="barTxt"></span><span id="barPct"></span></div>
    <div class="alert" id="alert"></div>
    <div class="line" id="leftLine"></div>
  </div>
  <div class="entry empty" id="entry">Tutar</div>
  <div class="pad" id="pad">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button>,</button><button>0</button><button aria-label="Sil">⌫</button>
  </div>
  <div class="cats off" id="cats"></div>
  <div class="sign">Flagellumdei, MD</div>
</div>

<!-- Geçmiş -->
<div class="sheet" id="historySheet">
  <div class="sheet-inner">
    <div class="sheet-head"><h2>Geçmiş</h2><button class="pill" id="closeHistory">Kapat</button></div>
    <div id="historyBody"></div>
    <div class="sign" style="margin-top:20px">Flagellumdei, MD</div>
  </div>
</div>

<!-- Harcama düzeltme -->
<div class="sheet" id="editSheet">
  <div class="sheet-inner">
    <h2>Harcamayı düzelt</h2>
    <p class="intro" id="editWhen"></p>
    <div class="field">
      <label for="editAmt">Tutar (TL)</label>
      <input class="f" id="editAmt" type="text" inputmode="decimal">
    </div>
    <div class="field">
      <label>Kategori</label>
      <div class="chips" id="editCats"></div>
    </div>
    <div class="field">
      <label for="editNote">Not (isteğe bağlı)</label>
      <input class="f" id="editNote" type="text">
    </div>
    <div class="err" id="editErr"></div>
    <button class="btn" id="editSave">KAYDET</button>
    <button class="btn sec" id="editCancel">Vazgeç</button>
    <button class="btn link" id="editDel">Harcamayı sil</button>
  </div>
</div>

<!-- Ayarlar -->
<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <h2>Ayarlar</h2>
    <p class="intro" id="intro">Bu bilgiler yalnızca bu telefonda saklanır.</p>
    <div class="field">
      <label for="budget">Aylık bütçe (TL)</label>
      <input class="f" id="budget" type="text" inputmode="decimal">
      <div class="hint" id="budgetHint"></div>
    </div>
    <div class="field">
      <label for="startDay">Dönem başlangıç günü</label>
      <input class="f" id="startDay" type="text" inputmode="numeric">
      <div class="hint" id="startHint"></div>
    </div>
    <div class="err" id="err"></div>
    <button class="btn" id="save">KAYDET</button>
    <button class="btn sec" id="cancel">Vazgeç</button>
    <div class="sign" style="margin-top:24px">Flagellumdei, MD</div>
    <!-- Yanlışlıkla basılmasın diye en altta, küçük ve soluk; onay için SIFIRLA yazılır -->
    <div style="margin-top:120px; text-align:center; opacity:.6">
      <button class="reset-link" id="reset">Baştan başla</button>
      <div class="hint" id="resetHint">Bütün harcamaları ve ayarları siler.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" hidden>Geri al</button></div>

<script>
(function () {
  // Yeni, sade sürüm: eski kayıtlara dokunmaz, kendi kayıt alanını kullanır
  var KEY = 'harcama-sade-v1';
  var DAY = 86400000;
  var CATS = [['market', 'Market'], ['yemek', 'Yemek'], ['yakit', 'Yakıt'], ['kahve', 'Kahve'], ['diger', 'Diğer']];
  var CAT_NAME = {};
  CATS.forEach(function (c) { CAT_NAME[c[0]] = c[1]; });

  // ---- Tarih yardımcıları (yerel saat, gece yarısına göre) ----
  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function dayIn(y, m, day) { return new Date(y, m, Math.min(day, daysInMonth(y, m))); }
  function dayDiff(a, b) { return Math.round((b - a) / DAY); }
  function today() { return midnight(new Date()); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // ---- Veri (yalnızca bu telefonda). Kodda hiçbir kişisel tutar yok. ----
  function load() {
    var d = null;
    try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!d || !Array.isArray(d.expenses)) d = { expenses: [] };
    // Artık olmayan bir kategoriye (ör. eski 'Fatura') girilmiş harcamalar 'Diğer' olur
    d.expenses.forEach(function (e) { if (!CAT_NAME[e.c]) e.c = 'diger'; });
    if (!Array.isArray(d.budgets)) d.budgets = [];       // [{from, amount}] aylık bütçe geçmişi
    if (!Array.isArray(d.startDays)) d.startDays = [];   // [{from, day}] başlangıç günü geçmişi
    return d;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  var state = load();
  function configured() { return state.budgets.length > 0 && state.startDays.length > 0 && state.since > 0; }

  // ---- Dönemler ----
  function startDayAt(t) {
    var day = state.startDays[0].day;
    state.startDays.forEach(function (e) { if (e.from <= t) day = e.day; });
    return day;
  }
  // Dönem bir ay sürer; başlangıç günü değiştiyse yeni günün ilk geldiği gün biter
  function nextStart(start) {
    var best = dayIn(start.getFullYear(), start.getMonth() + 1, startDayAt(start.getTime()));
    state.startDays.forEach(function (e) {
      if (e.from > start.getTime() && e.from < best.getTime()) best = new Date(e.from);
    });
    return best;
  }
  function periodOf(d, day) {
    var st = dayIn(d.getFullYear(), d.getMonth(), day);
    if (d < st) st = dayIn(d.getFullYear(), d.getMonth() - 1, day);
    return st;
  }
  function periods() {
    var t = today(), out = [];
    var s = periodOf(midnight(new Date(Math.min(state.since, t.getTime()))), state.startDays[0].day);
    for (var i = 0; i < 600; i++) {
      var n = nextStart(s);
      out.push({ start: s, next: n });
      if (n > t) break;
      s = n;
    }
    return out;
  }
  function budgetAt(t) {
    var amount = state.budgets[0].amount;
    state.budgets.forEach(function (b) { if (b.from <= t) amount = b.amount; });
    return amount;
  }

  // Her dönem (en eskisi başta). Aşım sonraki dönemden düşer, artan devretmez.
  // Dönemin ortasında başlanan ilk dönemin bütçesi kalan gün sayısına göre ayarlanır.
  function history() {
    var t = today(), over = 0;
    return periods().map(function (p) {
      var from = Math.max(p.start.getTime(), state.since), to = p.next.getTime();
      var base = budgetAt(p.start.getTime());
      if (from > p.start.getTime()) base = Math.round(base * dayDiff(new Date(from), p.next) / dayDiff(p.start, p.next));
      var spent = 0, cats = {};
      state.expenses.forEach(function (e) {
        if (e.t >= from && e.t < to) { spent += e.a; cats[e.c] = (cats[e.c] || 0) + e.a; }
      });
      var h = { start: p.start, from: new Date(from), next: p.next, end: new Date(to - DAY),
                budget: base - over, carried: over, spent: spent, cats: cats, current: p.next > t };
      over = Math.max(0, spent - h.budget);
      return h;
    });
  }

  // ---- Biçimlendirme ----
  var $ = function (id) { return document.getElementById(id); };
  function tl(n) { return (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('tr-TR') + ' ₺'; }
  function tlExact(n) { return n.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺'; }
  function dateTxt(d) { return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' }); }
  function dateShort(d) { return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }); }
  function timeTxt(d) { return d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }); }
  // "1 Ekim'de", "1 Kasım'da" — ek ay adına göre değişir
  var LOC = ['ta', 'ta', 'ta', 'da', 'ta', 'da', 'da', 'ta', 'de', 'de', 'da', 'ta'];
  function dateLoc(d) { return dateTxt(d) + '’' + LOC[d.getMonth()]; }
  function dateAbl(d) { return dateTxt(d) + '’' + LOC[d.getMonth()] + 'n'; }   // "1 Ekim'den", "1 Kasım'dan"
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function parseAmount(s) {
    var n = parseFloat(String(s).replace(/\./g, '').replace(',', '.'));
    return isFinite(n) ? Math.round(n * 100) / 100 : 0;
  }

  var toastTimer, toastUndo = null;
  function toast(msg, undo) {
    $('toastMsg').textContent = msg;
    toastUndo = undo || null;
    $('toastUndo').hidden = !undo;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').classList.remove('show'); toastUndo = null; }, undo ? 4000 : 1600);
  }
  $('toastUndo').addEventListener('click', function () {
    if (toastUndo) toastUndo();
    toastUndo = null;
    $('toast').classList.remove('show');
  });

  // ---- Ana ekran ----
  var typed = '';
  function render() {
    if (!configured()) return;
    var t = today(), tomorrow = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1);
    var h = history(), cur = h[h.length - 1];
    var spentToday = 0;
    state.expenses.forEach(function (e) { if (e.t >= t.getTime() && e.t < tomorrow.getTime()) spentToday += e.a; });
    var daysLeft = dayDiff(t, cur.next);                               // bugün dahil
    var v = Math.round((cur.budget - (cur.spent - spentToday)) / daysLeft - spentToday);

    $('periodTitle').textContent = dateShort(cur.from) + ' – ' + dateShort(cur.end);
    $('big').innerHTML = (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('tr-TR') + '<small>₺</small>';
    $('label').textContent = v < 0 ? 'Bugünkü payını aştın' : 'Bugün harcayabileceğin';

    var pct = cur.budget > 0 ? cur.spent / cur.budget : (cur.spent > 0 ? 9 : 0);
    $('big').classList.toggle('neg', v < 0);                         // rakam bugüne, çubuk döneme göre renk alır
    $('bar').firstElementChild.style.width = Math.min(100, pct * 100) + '%';
    $('bar').classList.toggle('warn', pct >= 0.8 && pct < 1);
    $('bar').classList.toggle('bad', pct >= 1);
    $('barTxt').textContent = tl(cur.spent) + ' / ' + tl(cur.budget);
    $('barPct').textContent = '%' + Math.round(pct * 100);
    var al = $('alert');
    if (pct >= 1) { al.className = 'alert bad'; al.textContent = 'Dönem bütçesini aştın'; }
    else if (pct >= 0.8) { al.className = 'alert warn'; al.textContent = 'Bütçenin %80’ini geçtin'; }
    else if (cur.carried > 0) { al.className = 'alert info'; al.textContent = 'Geçen dönemden ' + tl(cur.carried) + ' aşım düşüldü'; }
    else { al.className = 'alert'; al.textContent = ''; }
    $('leftLine').innerHTML = 'Kalan <b>' + tl(cur.budget - cur.spent) + '</b> · ' + daysLeft + ' gün';

    $('entry').textContent = typed ? typed + ' ₺' : 'Tutar';
    $('entry').classList.toggle('empty', !typed);
    $('cats').classList.toggle('off', !(parseAmount(typed) > 0));
    if ($('historySheet').classList.contains('open')) renderHistory();
  }

  $('cats').innerHTML = CATS.map(function (c) { return '<button data-c="' + c[0] + '">' + c[1] + '</button>'; }).join('');

  $('pad').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    var k = b.textContent;
    if (k === '⌫') typed = typed.slice(0, -1);
    else if (k === ',') { if (typed.indexOf(',') === -1) typed = (typed || '0') + ','; }
    else {
      var parts = typed.split(',');
      if (parts[1] !== undefined && parts[1].length >= 2) return;     // en fazla 2 kuruş hanesi
      if (parts[1] === undefined && parts[0].length >= 7) return;     // makul üst sınır
      typed = (typed === '0') ? k : typed + k;
    }
    render();
  });

  // Tutarı yazıp kategoriye basınca harcama kaydedilir
  $('cats').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    var a = parseAmount(typed);
    if (!(a > 0)) { toast('Önce tutarı yaz'); return; }
    var e = { id: uid(), t: Date.now(), a: a, c: b.dataset.c, n: '' };
    state.expenses.push(e);
    save();
    typed = '';
    render();
    toast(CAT_NAME[e.c] + ' · ' + tlExact(a) + ' eklendi', function () {
      state.expenses = state.expenses.filter(function (x) { return x.id !== e.id; });
      save();
      render();
    });
  });

  // ---- Geçmiş ----
  // Kategori dağılımı: en çok harcanan üstte, harcama olmayan kategoriler gösterilmez
  function catRows(cats, total) {
    var rows = CATS.filter(function (c) { return cats[c[0]] > 0; })
      .sort(function (a, b) { return cats[b[0]] - cats[a[0]]; })
      .map(function (c) {
        var v = cats[c[0]];
        return '<div class="catrow"><span>' + c[1] + '</span><div class="bar"><i style="width:' + (v / total * 100) +
          '%"></i></div><span>' + tl(v) + ' · %' + Math.round(v / total * 100) + '</span></div>';
      });
    return rows.length ? '<div class="cats-box">' + rows.join('') + '</div>' : '';
  }

  function renderHistory() {
    var h = history(), cur = h[h.length - 1];
    var from = cur.from.getTime(), to = cur.next.getTime();
    var list = state.expenses.filter(function (e) { return e.t >= from && e.t < to; })
      .sort(function (a, b) { return b.t - a.t; });
    var html = '';
    if (h.length > 1) {
      var all = {}, allSpent = 0;
      h.forEach(function (x) {
        allSpent += x.spent;
        Object.keys(x.cats).forEach(function (k) { all[k] = (all[k] || 0) + x.cats[k]; });
      });
      html += '<h3>Tüm dönemler</h3><div class="card"><h4>' + dateAbl(h[0].from) + ' bugüne</h4>' +
        '<div class="row"><span>Toplam harcanan</span><b>' + tl(allSpent) + '</b></div>' + catRows(all, allSpent) + '</div>';
    }
    html += '<h3>Bu dönem · ' + dateTxt(cur.from) + ' – ' + dateTxt(cur.end) + '</h3>';
    if (cur.spent > 0) {
      html += '<div class="card"><div class="row"><span>Harcanan</span><b>' + tl(cur.spent) + ' / ' + tl(cur.budget) + '</b></div>' +
        catRows(cur.cats, cur.spent) + '</div>';
    }
    html += list.length ? list.map(function (e) {
      var d = new Date(e.t);
      return '<button class="item" data-id="' + e.id + '"><div class="meta"><div>' + CAT_NAME[e.c] + '</div>' +
        '<div class="sub">' + dateShort(d) + ' ' + timeTxt(d) + (e.n ? ' · ' + esc(e.n) : '') + '</div></div>' +
        '<div class="amt">' + tlExact(e.a) + '</div></button>';
    }).join('') + '<div class="muted">Düzeltmek ya da silmek için harcamaya dokun.</div>'
      : '<div class="muted">Bu dönem henüz harcama yok.</div>';

    var done = h.filter(function (x) { return !x.current; }).reverse();
    if (done.length) {
      html += '<h3>Biten dönemler</h3>' + done.map(function (x) {
        var diff = x.budget - x.spent;
        return '<div class="card"><h4>' + dateTxt(x.from) + ' – ' + dateTxt(x.end) + '</h4>' +
          '<div class="row"><span>Bütçe</span><span>' + tl(x.budget) + '</span></div>' +
          '<div class="row"><span>Harcanan</span><span>' + tl(x.spent) + '</span></div>' +
          (diff >= 0 ? '<div class="res good">' + tl(diff) + ' biriktirilebilir</div>'
                     : '<div class="res badc">' + tl(-diff) + ' aşım · sonraki dönemden düşüldü</div>') +
          catRows(x.cats, x.spent) + '</div>';
      }).join('');
    }
    $('historyBody').innerHTML = html;
  }
  $('openHistory').addEventListener('click', function () { renderHistory(); $('historySheet').classList.add('open'); });
  $('closeHistory').addEventListener('click', function () { $('historySheet').classList.remove('open'); });
  $('historyBody').addEventListener('click', function (ev) {
    var b = ev.target.closest('.item');
    if (b) openEdit(b.dataset.id);
  });

  // ---- Düzeltme ----
  var editId = null, editCat = null;
  function openEdit(id) {
    var e = state.expenses.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    editId = id; editCat = e.c;
    var d = new Date(e.t);
    $('editWhen').textContent = dateTxt(d) + ' ' + timeTxt(d);
    $('editAmt').value = String(e.a).replace('.', ',');
    $('editNote').value = e.n || '';
    $('editErr').textContent = '';
    renderEditCats();
    $('editSheet').classList.add('open');
  }
  function renderEditCats() {
    $('editCats').innerHTML = CATS.map(function (c) {
      return '<button data-c="' + c[0] + '"' + (c[0] === editCat ? ' class="on"' : '') + '>' + c[1] + '</button>';
    }).join('');
  }
  $('editCats').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (b) { editCat = b.dataset.c; renderEditCats(); }
  });
  $('editCancel').addEventListener('click', function () { $('editSheet').classList.remove('open'); });
  $('editSave').addEventListener('click', function () {
    var a = parseAmount($('editAmt').value);
    if (!(a > 0)) { $('editErr').textContent = 'Tutar 0’dan büyük olmalı.'; return; }
    state.expenses.forEach(function (e) {
      if (e.id === editId) { e.a = a; e.c = editCat; e.n = $('editNote').value.trim(); }
    });
    save();
    $('editSheet').classList.remove('open');
    render();
    toast('Düzeltildi');
  });
  $('editDel').addEventListener('click', function () {
    if (!confirm('Bu harcama silinsin mi?')) return;
    state.expenses = state.expenses.filter(function (e) { return e.id !== editId; });
    save();
    $('editSheet').classList.remove('open');
    render();
    toast('Silindi');
  });

  // ---- Ayarlar ----
  function lastBudget() { return state.budgets[state.budgets.length - 1]; }
  function lastStartDay() { return state.startDays[state.startDays.length - 1]; }
  function currentPeriod() { var p = periods(); return p[p.length - 1]; }

  function openSettings() {
    var first = !configured();
    $('intro').textContent = first
      ? 'Başlamak için iki bilgiyi gir. Bunlar yalnızca bu telefonda saklanır.'
      : 'Bu bilgiler yalnızca bu telefonda saklanır.';
    $('cancel').style.display = first ? 'none' : '';
    $('reset').hidden = $('resetHint').hidden = first;
    $('budget').value = first ? '' : String(lastBudget().amount);
    $('startDay').value = first ? '' : String(lastStartDay().day);
    $('budgetHint').textContent = first
      ? 'Dönemin ortasında başlıyorsan ilk dönemin bütçesi kalan günlere göre ayarlanır.'
      : 'Değiştirirsen bu dönemden itibaren geçerli olur. Biten dönemler eski bütçeyle kalır.';
    $('startHint').textContent = first
      ? 'Kart ekstrenin kesim gününün ertesi günü.'
      : 'Değiştirirsen yeni gün, bir sonraki o günde başlar.';
    if (!first && lastStartDay().from > today().getTime()) {
      $('startHint').textContent = 'Yeni dönem ' + dateLoc(new Date(lastStartDay().from)) + ' başlayacak.';
    }
    $('err').textContent = '';
    $('sheet').classList.add('open');
  }
  $('openSettings').addEventListener('click', openSettings);
  $('cancel').addEventListener('click', function () { $('sheet').classList.remove('open'); });
  $('reset').addEventListener('click', function () {
    var answer = prompt('Bütün harcamalar ve ayarlar silinecek, bu geri alınamaz.\nOnaylamak için SIFIRLA yaz:');
    if (answer === null) return;
    if (answer.trim().toLocaleUpperCase('tr-TR').replace(/İ/g, 'I') !== 'SIFIRLA') { toast('Silinmedi'); return; }
    state = { expenses: [], budgets: [], startDays: [] };
    save();
    typed = '';
    openSettings();
    toast('Sıfırlandı');
  });
  $('save').addEventListener('click', function () {
    var b = parseAmount($('budget').value);
    var sd = parseInt($('startDay').value, 10);
    if (!(b > 0)) { $('err').textContent = 'Aylık bütçe 0’dan büyük olmalı.'; return; }
    if (!(sd >= 1 && sd <= 31)) { $('err').textContent = 'Başlangıç günü 1 ile 31 arasında olmalı.'; return; }
    var now = today();
    if (!configured()) {
      state.since = now.getTime();                                      // takibe başlanan gün
      state.budgets = [{ from: 0, amount: b }];
      state.startDays = [{ from: 0, day: sd }];
    } else {
      if (sd !== lastStartDay().day) {
        state.startDays = state.startDays.filter(function (e) { return e.from <= now.getTime(); });
        if (startDayAt(now.getTime()) !== sd) {
          var cand = dayIn(now.getFullYear(), now.getMonth(), sd);
          if (cand <= now) cand = dayIn(now.getFullYear(), now.getMonth() + 1, sd);
          state.startDays.push({ from: cand.getTime(), day: sd });
        }
      }
      if (b !== lastBudget().amount) {
        var ps = currentPeriod().start.getTime();
        state.budgets = state.budgets.filter(function (x) { return x.from < ps; });
        state.budgets.push({ from: state.budgets.length ? ps : 0, amount: b });
      }
    }
    save();
    $('sheet').classList.remove('open');
    render();
    toast('Kaydedildi');
  });

  // Gece yarısı geçince ve uygulamaya geri dönünce yeniden hesapla
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
  setInterval(render, 60000);

  if (configured()) render(); else openSettings();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
